[workspace]
resolver = "3"
members = ["crates/core", "crates/sources", "crates/store", "crates/cli", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/masenf/sdr-scanner"

[workspace.dependencies]
scanner-core = { path = "crates/core" }
scanner-sources = { path = "crates/sources" }
scanner-store = { path = "crates/store" }
scanner-web = { path = "crates/web" }
num-complex = "0.4"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tempfile = "3"
ctrlc = "3.4"
rayon = "1.10"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
debug = 1
