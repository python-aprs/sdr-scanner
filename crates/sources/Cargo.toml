[package]
name = "scanner-sources"
description = "IQ sample sources for sdr-scanner: files (SigMF), SDRplay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Hardware backends are feature-gated so the rest of the workspace builds and
# tests without a vendor SDK installed. (Airspy gets an `airspy` feature when
# its backend is written.)
# Needs the SDRplay API 3.x header (sdrplay_api.h) at build time; set
# SDRPLAY_API_INCLUDE if it is not in /usr/local/include. The library is
# opened at run time.
sdrplay = ["dep:cc"]

[dependencies]
scanner-core.workspace = true
num-complex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
tempfile.workspace = true
