[package]
name = "scanner-core"
description = "DSP, configuration and timing primitives for sdr-scanner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Lets binaries read the mbelib shared library folder (DEP_SCANNER_MBE_RPATH)
# for their rpath; see build.rs.
links = "scanner_mbe"

[features]
default = []
# AMBE+2 voice for DMR through mbelib-neo (or classic mbelib), open-source
# decoders of DVSI's patented codec; whether you may use them is for you to
# judge. mbelib-neo is GPL-2.0-or-later, so a binary built with this feature
# carries the GPL. Needs the library and its headers at build time: set
# MBELIB_DIR to the install prefix if it is not /usr/local, /opt/homebrew or
# /usr. Without the feature, DMR calls are still decoded and recorded, with
# their voice frames kept as `.amb`.
mbelib = ["dep:cc"]

[dependencies]
num-complex.workspace = true
rustfft.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
rayon.workspace = true

[build-dependencies]
cc = { version = "1", optional = true }

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "scanner"
harness = false
