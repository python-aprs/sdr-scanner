# Cowlitz County, WA public safety, VHF high band (~150 MHz).
#
# Analog narrowband FM channels from a county frequency list, for testing
# against busy channels with strong signals. Only the listed channels are
# watched (grid = false): the span also covers marine VHF and other services
# we do not want filling the recordings.
#
# Check with:  scanner config check config/cowlitz.toml --slots
# Run with:    scanner serve --source sdrplay --config config/cowlitz.toml \
#                --profile cowlitz-vhf
#
# The span is 7 MHz so it fits inside an RSP1A at 8 MS/s (the usable part is
# about 0.9 x the sample rate). The default tuner frequency is the span centre
# plus 12.5 kHz, 156.5125 MHz, which is clear of every listed channel.
#
# Left out of this profile:
#   151.085      County Roads: below the span; 151.085 to 159.42 MHz is 8.3 MHz,
#                more than 8 MS/s covers cleanly. Make a second profile
#                (or move the span down and drop 158.925 and up) to hear it.
#   157.740      CresComm paging, Cowlitz County: digital paging, no decoder.
#   168-172 MHz  Federal IWN site 114: P25, and outside the span.
#   453.150      Lower Columbia College security (UHF, trunked).
#   440.375      AB7F repeater (70 cm; see config/rainier.toml).
#   122-135 MHz  Kelso and Woodland airports: AM aircraft band.
#   T 40912      Sheriff drug task force talkgroup (trunked).
#
# `tone` is the CTCSS tone the channel is listed with. It is informational:
# compare it with the tone the scanner tags on each recording.

[profiles.cowlitz-vhf]
span       = { start = "153.000 MHz", stop = "160.000 MHz" }
grid       = false
bandwidth  = "11 kHz"       # 12.5 kHz narrowband
deviation  = "2.5 kHz"
audio_rate = 8000
deemphasis = true

