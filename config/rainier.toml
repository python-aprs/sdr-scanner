# Band profiles for the Rainier, OR site (46.089 N, 122.936 W).
#
# The repeater entries below are generated; regenerate them from fresh
# coordinator exports with tools/channels/import_repeaters.py (see
# tools/channels/README.md), then paste them under the matching profile.
# Hand-edited channels and lockouts live at the top of each profile.
#
# Check with:  scanner config check config/rainier.toml --slots

[profiles.rainier-2m]
span       = { start = "144.000 MHz", stop = "148.000 MHz" }
spacing    = "25 kHz"      # fallback grid for unlisted signals
bandwidth  = "16 kHz"
deviation  = "5 kHz"
audio_rate = 8000
deemphasis = true

[[profiles.rainier-2m.channels]]
freq     = "146.5200 MHz"
name     = "National simplex calling"
priority = true

[[profiles.rainier-2m.channels]]
freq   = "144.3900 MHz"
name   = "APRS"
mode   = "afsk1200"           # decodes AX.25 packets; no audio files

[[profiles.rainier-2m.channels]]
freq   = "144.9200 MHz"
name   = "Packet"
mode   = "afsk1200"

[[profiles.rainier-2m.lockouts]]
start  = "144.000 MHz"
stop   = "144.300 MHz"
reason = "CW, SSB and weak signal; not useful as NBFM (Phase 7)"

# TODO: WWARA 2 m band plan simplex channels (listed explicitly so they get
# names; until then the 25 kHz grid covers them).

[profiles.rainier-70cm]
