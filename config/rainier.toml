# Band profiles for the Rainier, OR site (46.089 N, 122.936 W).
#
# The repeater entries below are generated with tools/channels/import_repeaters.py
# (see tools/channels/README.md): 2 m from a RepeaterBook export, 70 cm from
# the WWARA and ORRC coordinator lists. Replace them when regenerating.
# Hand-kept channels and lockouts live at the top of each profile, and
# local additions (repeaters RepeaterBook lacks, odd simplex frequencies) in
# rainier-custom.toml, which is merged in by the include below.
#
# Check with:  scanner config check config/rainier.toml --slots

include = ["rainier-custom.toml"]

[profiles.rainier-2m]
span       = { start = "144.000 MHz", stop = "148.000 MHz" }
spacing    = "25 kHz"      # fallback grid for unlisted signals
simplex_spacing = "10 kHz" # also every 10 kHz-round frequency (146.52, 147.58, ...)
bandwidth  = "16 kHz"
deviation  = "5 kHz"
audio_rate = 8000
deemphasis = true

[[profiles.rainier-2m.channels]]
freq     = "146.5200 MHz"
name     = "National simplex calling"
priority = true

[[profiles.rainier-2m.channels]]
freq   = "144.3900 MHz"
name   = "APRS"
mode   = "afsk1200"           # decodes AX.25 packets; no audio files

[[profiles.rainier-2m.channels]]
freq   = "144.9200 MHz"
name   = "Packet"
mode   = "afsk1200"

[[profiles.rainier-2m.channels]]
freq      = "145.7900 MHz"
name      = "DMR simplex"
mode      = "dmr"            # talkgroup and radio ids; audio with the mbelib build
bandwidth = "11 kHz"

[[profiles.rainier-2m.lockouts]]
start  = "144.000 MHz"
stop   = "144.300 MHz"
reason = "CW, SSB and weak signal; not useful as NBFM (Phase 7)"

[[profiles.rainier-2m.lockouts]]
start = "146.442 MHz"
stop = "146.443 MHz"
reason = "Constant interference (1s undecodable digital)"

# TODO: WWARA 2 m band plan simplex channels (listed explicitly so they get
# names; until then the 25 kHz grid covers them).

[profiles.rainier-70cm]
span       = { start = "440.000 MHz", stop = "450.000 MHz" }
spacing    = "25 kHz"
bandwidth  = "16 kHz"
deviation  = "5 kHz"
audio_rate = 8000
deemphasis = true

