[project]
name = "sdr-scanner-synth"
version = "0.1.0"
description = "Synthetic IQ generator for sdr-scanner tests: SigMF recordings plus ground truth"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
synth = "synth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synth"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
